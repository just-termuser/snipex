{% extends "base.html" %}

{% block content %}
<div class="mb-8">
    <div class="relative max-w-sm">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-600 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" name="q"
            hx-get="{% url 'search_users' %}"
            hx-trigger="keyup changed delay:400ms"
            hx-target="#search-results"
            placeholder="Search users..."
            class="w-full bg-gray-900 border border-gray-800 rounded-lg pl-10 pr-4 py-2 text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-colors">
    </div>
    <div id="search-results" class="mt-1 max-w-sm"></div>
</div>

<div id="board">
    {% include "snippets/partials/snippets_board.html" %}
</div>
{% endblock %}
