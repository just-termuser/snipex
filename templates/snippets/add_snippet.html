{% extends "base.html" %}

{% block title %}Add Snippet - Snipex{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <h1 class="text-xl font-bold text-gray-100 mb-6">Add Snippet</h1>

    <form method="post" action="{% url 'add_snippet' %}" class="space-y-5">
        {% csrf_token %}

        <div>
            <label for="title" class="block text-sm font-medium text-gray-400 mb-1.5">Title</label>
            <input type="text" id="title" name="title" required
                class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2.5 text-sm text-gray-100 placeholder-gray-700 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-colors"
                placeholder="My awesome snippet">
        </div>

        <div>
            <label for="content" class="block text-sm font-medium text-gray-400 mb-1.5">Content</label>
            <textarea id="content" name="content" required rows="14"
                class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-sm text-gray-300 font-mono placeholder-gray-700 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-colors resize-y leading-relaxed"
                placeholder="// Your code here..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="category" class="block text-sm font-medium text-gray-400 mb-1.5">Category</label>
                <select id="category" name="category"
                    class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-colors">
                    {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="language" class="block text-sm font-medium text-gray-400 mb-1.5">Language</label>
                <select id="language" name="language"
                    class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2.5 text-sm text-gray-100 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-colors">
                    {% for language in languages %}
                    <option value="{{ language.id }}">{{ language.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label for="tags" class="block text-sm font-medium text-gray-400 mb-1.5">Tags</label>
            <input type="text" id="tags" name="tags"
                class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2.5 text-sm text-gray-100 placeholder-gray-700 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-colors"
                placeholder="python, django, api">
        </div>

        <div class="flex items-center gap-3">
            <input type="checkbox" id="isPublic" name="isPublic"
                class="w-4 h-4 rounded bg-gray-900 border-gray-700 accent-indigo-600">
            <label for="isPublic" class="text-sm text-gray-400 select-none cursor-pointer">Make this snippet public</label>
        </div>

        <div class="flex gap-3 pt-1">
            <button type="submit"
                class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors">
                Add Snippet
            </button>
            <a href="{% url 'home' %}"
                class="px-5 py-2.5 bg-gray-900 hover:bg-gray-800 text-gray-400 text-sm font-medium rounded-lg border border-gray-800 transition-colors">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
