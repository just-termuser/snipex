{% extends "base.html" %}
{% load snippet_filters %}

{% block title %}Favorites - Snipex{% endblock %}

{% block content %}
<div id="favorites">
    <h1 class="text-xl font-bold text-gray-100 mb-6">My Favorites</h1>

    {% for snippet in snippets %}
    {% include "snippets/partials/snippet.html" %}
    {% empty %}
    <div class="text-center py-20">
        <p class="text-gray-700 text-sm mb-2">No favorites yet.</p>
        <a href="{% url 'home' %}" class="text-sm text-indigo-500 hover:text-indigo-400 transition-colors">Browse snippets &rarr;</a>
    </div>
    {% endfor %}
{% endblock %}
