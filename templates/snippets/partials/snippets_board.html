{% load snippet_filters %}
<div class="flex flex-wrap gap-2 mb-6">
    <a href="{% url 'home' %}"
       hx-get="{% url 'home' %}"
       hx-target="#board"
       hx-push-url="true"
       class="px-3 py-1 text-xs font-medium rounded-full transition-colors {% if not current_category %}bg-indigo-600 text-white{% else %}bg-gray-900 text-gray-500 border border-gray-800 hover:text-gray-300 hover:border-gray-700{% endif %}">
        All
    </a>
    {% for category in categories %}
    <a href="{% url 'category_filter' category.id %}"
       hx-get="{% url 'category_filter' category.id %}"
       hx-trigger="click"
       hx-target="#board"
       hx-push-url="true"
       class="px-3 py-1 text-xs font-medium rounded-full transition-colors {% if current_category == category.name %}bg-indigo-600 text-white{% else %}bg-gray-900 text-gray-500 border border-gray-800 hover:text-gray-300 hover:border-gray-700{% endif %}">
        {{ category.name }}
    </a>
    {% endfor %}
</div>

{% for snippet in snippets %}
{% include "snippets/partials/snippet.html" %}
{% empty %}
<div class="text-center py-20">
    <p class="text-gray-700 text-sm">No snippets found.</p>
</div>
{% endfor %}
