{% if request.user in snippet.favorites.all %}
<form>
    {% csrf_token %}
    <button hx-post="{% url 'toggle_favorite' snippet.pk %}" hx-target="this"
        class="flex items-center gap-1 text-xs text-amber-500 hover:text-amber-400 transition-colors">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        Saved
    </button>
</form>
{% else %}
<form>
    {% csrf_token %}
    <button hx-post="{% url 'toggle_favorite' snippet.pk %}" hx-target="this"
        class="flex items-center gap-1 text-xs text-gray-600 hover:text-amber-500 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.601a.562.562 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/>
        </svg>
        Save
    </button>
</form>
{% endif %}
