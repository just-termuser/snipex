{% if users %}
<div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-xl">
    {% for user in users %}
    <a href="{% url 'user_profile' user.username %}"
        class="flex items-center gap-3 px-4 py-2.5 hover:bg-gray-800 transition-colors {% if not forloop.last %}border-b border-gray-800{% endif %}">
        <div class="w-7 h-7 bg-indigo-950 rounded-full flex items-center justify-center shrink-0 border border-indigo-900">
            <span class="text-indigo-400 text-xs font-semibold font-mono">{{ user.username|first|upper }}</span>
        </div>
        <span class="text-sm text-gray-300">{{ user.username }}</span>
    </a>
    {% endfor %}
</div>
{% endif %}
